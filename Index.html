<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelayanan Masyarakat Desa</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f2f2f2; }
        header { background: #2c7be5; padding: 15px; color: white; text-align: center; }
        nav { background: #1b4f9c; padding: 10px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        .container { padding: 20px; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        input, select, button { padding: 10px; width: 100%; margin-top: 10px; }
        button { background: #2c7be5; color: white; border: none; cursor: pointer; }
        button:hover { background: #1b4f9c; }
        .antrian-list { padding: 10px; background: #eee; border-radius: 5px; margin: 5px 0; }
    </style>
</head>
<body><header>
    <h1>Pelayanan Masyarakat Desa</h1>
</header><nav>
    <a href="#" onclick="show('home')">Beranda</a>
    <a href="#" onclick="show('pelayanan')">Pelayanan</a>
</nav><div class="container"><!-- HALAMAN UTAMA -->
<div id="home" class="card">
    <h2>Selamat Datang di Sistem Pelayanan Desa</h2>
    <p>Gunakan layanan online untuk melakukan pendaftaran antrian dan memantau status pelayanan Anda.</p>
</div>

<!-- HALAMAN PELAYANAN -->
<div id="pelayanan" class="card" style="display:none;">
    <h2>Pendaftaran Antrian Pelayanan</h2>
    <label>Nama Lengkap:</label>
    <input type="text" id="nama">

    <label>Jenis Pelayanan:</label>
    <select id="layanan">
        <option value="Surat Pengantar">Surat Pengantar</option>
        <option value="Surat Domisili">Surat Domisili</option>
        <option value="KTP / KK">KTP / KK</option>
        <option value="Administrasi Lainnya">Administrasi Lainnya</option>
    </select>

    <button onclick="daftarAntrian()">Daftar Antrian</button>

    <h3>Daftar Antrian Saat Ini:</h3>
    <div id="listAntrian"></div>
</div>

</div><script>
    function show(page) {
        document.getElementById('home').style.display = 'none';
        document.getElementById('pelayanan').style.display = 'none';
        document.getElementById(page).style.display = 'block';
    }

    let antrian = [];

    function daftarAntrian() {
        const nama = document.getElementById('nama').value;
        const layanan = document.getElementById('layanan').value;

        if(nama === ""){
            alert("Nama tidak boleh kosong");
            return;
        }

        const nomor = antrian.length + 1;
        antrian.push({ nomor, nama, layanan});
        alert("Pendaftaran berhasil! Nomor antrian Anda: " + nomor);
        renderAntrian();
        document.getElementById('nama').value = "";
    }

    function renderAntrian(){
        const div = document.getElementById('listAntrian');
        div.innerHTML = "";
        antrian.forEach(a => {
            div.innerHTML += `<div class='antrian-list'>#${a.nomor} - ${a.nama} (${a.layanan})</div>`;
        });
    }
</script></body>
</html>
